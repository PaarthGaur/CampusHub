    <!-- Script to render and manage the bookmarks -->
    <script>
        function renderBookmarks() {
            const grid = document.querySelector('.bookmark_grid');
            const countDisplay = document.querySelector('.bookmark_count');
            
            // 1. Get live data from localStorage instead of hardcoded array
            let savedBookmarks = JSON.parse(localStorage.getItem('campusHub_bookmarks')) || [];
            
            grid.innerHTML = ""; 

            // 2. Handle empty state
            if (savedBookmarks.length === 0) {
                grid.innerHTML = "<p style='color: var(--secondary-text); padding: 20px 0;'>No bookmarks saved yet. Go to your subjects to add some!</p>";
                countDisplay.innerText = `🔖 0 Saved`;
                return;
            }

            // 3. Loop through saved items and build HTML
            savedBookmarks.forEach((bookmark, index) => {
                const subject = subjects[bookmark.subjectId];
                if (!subject) return;

                const resource = subject.resources[bookmark.resourceIndex];
                const type = resource[0]; 
                const title = resource[1];
                const desc = resource[2];
                
                const rating = subject.stats.find(s => s[2] === "Rating")[1];

                let tagClass = "notes";
                if (type === "PYQs") tagClass = "pyq";
                if (type === "PRACTICE") tagClass = "important";
                if (type === "VIDEO" || type === "PPT") tagClass = "revision";

                // Added an onclick event to the remove button
                const cardHTML = `
                    <div class="bookmark_card">
                        <div class="bookmark_top">
                            <span class="resource_tag ${tagClass}">${type}</span>
                            <button class="remove_bookmark" onclick="removeBookmark(${index})" title="Remove bookmark">🔖</button>
                        </div>
                        <h2>${title}</h2>
                        <p>${desc}</p>
                        <div class="bookmark_info">
                            <span>📚 ${subject.name}</span>
                            <span>⭐ ${rating}</span>
                        </div>
                        <a href="#" class="view_btn">Open Resource →</a>
                    </div>
                `;
                
                grid.innerHTML += cardHTML;
            });

            countDisplay.innerText = `🔖 ${savedBookmarks.length} Saved`;
        }

        // Function to handle removing items directly from the bookmarks page
        function removeBookmark(indexToRemove) {
            let savedBookmarks = JSON.parse(localStorage.getItem('campusHub_bookmarks')) || [];
            savedBookmarks.splice(indexToRemove, 1);
            localStorage.setItem('campusHub_bookmarks', JSON.stringify(savedBookmarks));
            
            // Re-render the page to immediately hide the deleted card
            renderBookmarks();
        }

        // Execute when the page loads
        renderBookmarks();
    </script>
