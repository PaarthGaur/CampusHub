<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub - Login Account</title>

    <link rel="stylesheet" href="css\signup.css">
</head>

<body>

    <main class="page-container">

        <section class="signup-card">

            <!-- ================= LEFT SIDE ================= -->
            <div class="form-section">

                <!-- Logo -->
                <div class="brand">
                    <div class="brand-logo">
                        C
                    </div>

                    <span class="brand-name">Campus<span>Hub</span></span>
                </div>


                <!-- Heading -->
                <div class="form-header">
                    <h1>Welcome Back!!</h1>

                    <p>
                        Glad to to have you back with us.
                    </p>
                </div>


                <!-- Signup Form -->
                <form class="signup-form" id="LoginForm">

                    <!-- Full Name -->
                    <div class="input-group">
                        <label for="fullname">Full Name</label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <!-- Username -->
                    <div class="input-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                        >
                    </div>


                    


                    <!-- Password Fields -->
                    <div class="password-row">

                        <div class="input-group">
                            <label for="password">Password</label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                            >
                        </div>

                    </div>


                   
                    


                    <!-- Main Button -->
                    <button type="submit" class="signup-button">
                        Login
                    </button>

                </form>


                <!-- Divider
                <div class="divider">
                    <span></span>
                    <p>or sign up with</p>
                    <span></span>
                </div> -->


                <!-- Social Buttons
                <div class="social-buttons">

                    <button type="button" class="social-button">
                        <span class="google-icon">G</span>
                        <span>Sign up with Google</span>
                    </button>


                    <button type="button" class="social-button">
                        <span class="facebook-icon">f</span>
                        <span>Sign up with Facebook</span>
                    </button>

                </div> -->


                <!-- Login -->
                <div class="login-text">

                    <p>
                        Do not have an account?
                        <a href="signup.html">Sign Up</a>
                    </p>

                </div>

            </div>



            <!-- ================= RIGHT SIDE ================= -->
            <aside class="visual-section">

                <!-- Decorative shapes -->
                <div class="circle circle-one"></div>
                <div class="circle circle-two"></div>
                <div class="circle circle-three"></div>


                <!-- Main visual content -->
                <div class="visual-content">

                    <div class="learning-icon">
                        🎓
                    </div>

                    <span class="visual-label">
                        CAMPUSHUB
                    </span>

                    <h2>
                        Your learning
                        <br>
                        journey starts here.
                    </h2>

                    <p>
                        Connect, learn, collaborate and
                        make your university experience better.
                    </p>

                </div>


                <!-- Bottom decorative card -->
                <div class="visual-card">

                    <div class="mini-icon">
                        ✦
                    </div>

                    <div>
                        <strong>Learn. Connect. Grow.</strong>

                        <span>
                            Everything students need in one place.
                        </span>
                    </div>

                </div>

            </aside>

        </section>

    </main>
<script src="js/login.js"></script>
</body>
</html>
