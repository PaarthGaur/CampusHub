<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub - Login Account</title>
    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <main class="page-container">

        <section class="signup-card">

            <!-- ================= LEFT SIDE ================= -->
            <div class="form-section">

                <!-- Logo -->
                <div class="brand">
                    <div class="brand-logo">C</div>
                    <span class="brand-name">Campus<span>Hub</span></span>
                </div>

                <!-- Heading -->
                <div class="form-header">
                    <h1>Welcome Back!</h1>
                    <p>Glad to have you back with us.</p>
                </div>

                <!-- Login Form -->
                <form class="signup-form" id="LoginForm">

                    <!-- Email or Username -->
                    <div class="input-group">
                        <label for="identifier">Email or Username</label>
                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            placeholder="Enter your email or username"
                            required
                            autofocus
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="password-row">
                        <div class="input-group" style="width: 100%;">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required
                            >
                        </div>
                    </div>

                    <!-- Main Button -->
                    <button type="submit" class="signup-button">
                        Login
                    </button>

                </form>

                <!-- Signup Link -->
                <div class="login-text">
                    <p>
                        Do not have an account?
                        <a href="signup.html">Sign Up</a>
                    </p>
                </div>

            </div>

            <!-- ================= RIGHT SIDE ================= -->
            <aside class="visual-section">

                <!-- Decorative shapes -->
                <div class="circle circle-one"></div>
                <div class="circle circle-two"></div>
                <div class="circle circle-three"></div>

                <!-- Main visual content -->
                <div class="visual-content">
                    <div class="learning-icon">🎓</div>
                    <span class="visual-label">CAMPUSHUB</span>
                    <h2>Your learning<br>journey starts here.</h2>
                    <p>Connect, learn, collaborate and make your university experience better.</p>
                </div>

                <!-- Bottom decorative card -->
                <div class="visual-card">
                    <div class="mini-icon">✦</div>
                    <div>
                        <strong>Learn. Connect. Grow.</strong>
                        <span>Everything students need in one place.</span>
                    </div>
                </div>

            </aside>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
